<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Six perspectives. One room. Review fictional cases, deliberate with your jury, and make a considered call.">
  <meta name="theme-color" content="#101426">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Jury Room">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>The Jury Room</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;background:#101426;color:#f5f4ef}
    #arrival{position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:12px/1.8 system-ui,sans-serif;letter-spacing:2px}
    #arrival img{width:88px;height:88px;margin:0 auto 20px;border-radius:22px}
    #arrival p{opacity:.7;letter-spacing:0;font-size:13px}
  </style>
</head>
<body>
  <div id="arrival" role="status"><img src="icons/Icon-192.png" alt=""><span>LIVE JURY</span><p>Preparing your seat…</p></div>
  <noscript>This experience requires JavaScript. Enable it to enter the jury room.</noscript>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('arrival')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
